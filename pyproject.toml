[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "powerscale-rag-connector"
version = "2.0.0"
dependencies = [
  "elasticsearch>=8,<9"
]
authors = [
  { name = "Adam Brenner", email = "adam.brenner@dell.com" },
  { name = "Michael Horgan", email = "mike.horgan1@dell.com" },
  { name = "Sanne Bloemsma", email = "sanne.bloemsma@dell.com" }
]
keywords = ["PowerScale", "OneFS", "Dell"]
description = "An open-source python library designed to enhance RAG application performance during data ingestion by skipping files that have already been processed for Dell PowerScale storage."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
license = "MIT"

[project.urls]
Homepage = "https://github.com/dell/powerscale-rag-connector"
Issues = "https://github.com/dell/powerscale-rag-connector/issues"
Repository = "https://github.com/dell/powerscale-rag-connector.git"


[project.optional-dependencies]
langchain = [
  "langchain-core",
  "langchain-unstructured",
]
llamaindex = [
  "llama-index",
  "llama-index-readers-file",
  "unstructured",
]
# aggregate
all = [
  "langchain-core",
  "langchain-unstructured",
  "llama-index",
  "llama-index-readers-file",
  "unstructured",
]
test = [
  "pytest>=7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
